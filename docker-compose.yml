services:
  mysql:
    image: mysql:8.4
    container_name: workflex-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: workflex
      MYSQL_USER: workflex
      MYSQL_PASSWORD: workflex
    ports:
      - "3007:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uworkflex", "-pworkflex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
