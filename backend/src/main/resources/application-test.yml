spring:
  datasource:
    url: jdbc:h2:mem:workflex;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

workflex:
  csv-import:
    enabled: true
    resource-path: classpath:data/workations.csv
